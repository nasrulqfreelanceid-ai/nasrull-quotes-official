<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nasrull Quotes Official.</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:linear-gradient(180deg,#ff7a00,#ff2e63);min-height:100vh;padding:30px 16px 60px;text-align:center;color:white}
.top{font-size:12px;letter-spacing:3px;font-weight:bold}
h1{font-size:36px;margin:14px 0 8px;line-height:1.1}
.sub{font-weight:bold;font-size:16px}
.card{background:white;color:#2d0a2e;border-radius:24px;max-width:480px;margin:24px auto 0;padding:22px;text-align:left;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.badge{display:flex;justify-content:space-between;align-items:center}
.badge span:first-child{background:#ffe8f2;color:#c2185b;padding:8px 12px;border-radius:999px;font-size:12px;font-weight:bold}
.badge span:last-child{font-size:13px;color:#666;font-weight:bold}
.quote{font-size:26px;line-height:1.35;font-weight:800;text-align:center;margin:28px 0 10px;min-height:130px}
.author{text-align:center;font-size:11px;letter-spacing:2px;color:#888;margin:14px 0 20px}
.footer{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #eee;padding-top:16px}
.footer p{font-size:12px;color:#666;font-weight:bold;text-align:left}
.btn{border:none;background:linear-gradient(90deg,#ff8a00,#ff2e63);color:white;padding:13px 18px;border-radius:999px;font-weight:bold;cursor:pointer}
.btn2{background:#2d0a2e;margin-top:12px;width:100%}
.editBox{display:none;background:#fff;color:#222;border-radius:20px;max-width:480px;margin:16px auto;padding:18px;text-align:left}
.editBox h3{font-size:16px;margin-bottom:10px}
.editBox textarea{width:100%;min-height:60px;padding:10px;border:1px solid #ddd;border-radius:10px;margin-bottom:10px;font-size:14px}
.editBox label{font-size:12px;font-weight:bold;color:#c2185b}
.small{font-size:12px;color:#eee;margin-top:18px;font-weight:bold}
</style>
</head>
<body>
<div class="top">✦ DARI HATI, UNTUK KAMU</div>
<h1>Nasrull Quotes Official.</h1>
<div class="sub">Sedikit kata, banyak rasa.</div>
<div class="card">
<div class="badge"><span>♡ BUCIN SECUKUPNYA</span><span id="counter">01 / 10</span></div>
<div class="quote" id="quoteText"></div>
<div class="author">— NASRULL OFFICIAL</div>
<div class="footer"><p>Satu klik, satu rasa<br>baru.</p><button class="btn" onclick="nextQuote()">Ganti Quotes →</button></div>
</div>
<button class="btn btn2" onclick="toggleEdit()">✏️ Edit Quotes - Klik Disini Buat Ganti Kata-Kata</button>
<div class="editBox" id="editBox">
<h3>✏️ Ganti Quotes Lu Disini</h3>
<p style="font-size:12px;margin-bottom:12px">Ketik quotes baru lu, terus pencet SIMPAN.</p>
<div id="editList"></div>
<button class="btn" style="width:100%" onclick="saveQuotes()">💾 SIMPAN SEMUA</button>
<button class="btn" style="width:100%;background:#999;margin-top:8px" onclick="resetQuotes()">Reset Ke Awal</button>
</div>
<div class="small">Untuk yang sedang jatuh cinta, atau diam-diam menyimpan rasa.</div>
<script>
const defaultQuotes=["Aku nggak butuh seribu alasan untuk bahagia. Cukup kamu, itu aja.","Kamu itu bukan sekadar singgah, kamu itu pulang.","Kalau rindu itu dosa, biar aku jadi pendosa paling setia.","Gak perlu jadi sempurna, cukup jadi kamu yang selalu bikin tenang.","Cinta itu sederhana, yang ribet itu gengsi.","Sejak ada kamu, sepi jadi terasa rame.","Aku nggak janji selalu ada, tapi aku janji selalu berusaha ada.","Kalau mencintaimu adalah perjalanan, aku nggak buru-buru sampai. Aku ingin menikmati setiap langkah bersamamu.","Jatuh cinta itu gampang, yang susah itu jatuh cinta sama orang yang tepat, dan itu kamu.","Kamu itu alasan kenapa senyumku gak pernah gagal."];
let quotes=JSON.parse(localStorage.getItem('nasrull_quotes')||JSON.stringify(defaultQuotes));
let idx=0;
function show(){document.getElementById('quoteText').innerText=quotes[idx];document.getElementById('counter').innerText=String(idx+1).padStart(2,'0')+' / '+quotes.length;}
function nextQuote(){idx=(idx+1)%quotes.length;show();}
function toggleEdit(){let b=document.getElementById('editBox');let open=b.style.display==='block';b.style.display=open?'none':'block';if(!open){let html='';quotes.forEach((q,i)=>{html+='<label>Quotes '+(i+1)+'</label><textarea id="q'+i+'">'+q+'</textarea>';});document.getElementById('editList').innerHTML=html;}}
function saveQuotes(){let baru=[];quotes.forEach((_,i)=>{baru.push(document.getElementById('q'+i).value||quotes[i]);});quotes=baru;localStorage.setItem('nasrull_quotes',JSON.stringify(quotes));show();alert('Berhasil disimpan cok! ✅');toggleEdit();}
function resetQuotes(){localStorage.removeItem('nasrull_quotes');quotes=[...defaultQuotes];show();alert('Udah balik ke awal!');}
show();
</script>
</body>
</html>
